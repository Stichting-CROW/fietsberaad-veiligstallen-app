name: NS locations job

on:
  schedule:
    # GitHub schedules are UTC. 03:05 and 04:05 cover 05:05 Europe/Amsterdam in winter and summer.
    - cron: "5 3 * * *"
    - cron: "5 4 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Sync NS stallingen and fietskluizen
        run: |
          set -e
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$(TZ=Europe/Amsterdam date +%z)" = "+0200" ]; then WANTED="5 3 * * *"; else WANTED="5 4 * * *"; fi
            if [ "$EVENT_SCHEDULE" != "$WANTED" ]; then
              echo "NS locations job skipped: the other schedule is 05:05 Europe/Amsterdam today"
              exit 0
            fi
          fi
          BASE_URL="${PROD_NEXTAUTH_URL%/}"
          if [ -z "$CRON_SECRET" ] || [ -z "$BASE_URL" ]; then
            echo "NS locations job skipped: URL or token is not configured"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/ns-locations-job.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/ns-locations")
          cat /tmp/ns-locations-job.json
          echo
          test "$CODE" = "200"
        env:
          PROD_NEXTAUTH_URL: ${{ secrets.PROD_NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
