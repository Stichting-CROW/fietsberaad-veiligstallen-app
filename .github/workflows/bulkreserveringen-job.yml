name: Bulkreserveringen job

on:
  schedule:
    # GitHub schedules are UTC. 02:02 and 03:02 cover 04:02 Europe/Amsterdam in summer and winter.
    - cron: "2 2 * * *"
    - cron: "2 3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll forward recurring bulk reservations
        run: |
          set -e
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$(TZ=Europe/Amsterdam date +%z)" = "+0200" ]; then WANTED="2 2 * * *"; else WANTED="2 3 * * *"; fi
            if [ "$EVENT_SCHEDULE" != "$WANTED" ]; then
              echo "Bulkreserveringen job skipped: the other schedule is 04:02 Europe/Amsterdam today"
              exit 0
            fi
          fi
          BASE_URL="${PROD_NEXTAUTH_URL%/}"
          if [ -z "$CRON_SECRET" ] || [ -z "$BASE_URL" ]; then
            echo "Bulkreserveringen job skipped: URL or token is not configured"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/bulkreserveringen-job.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/bulkreserveringen")
          cat /tmp/bulkreserveringen-job.json
          echo
          test "$CODE" = "200"
        env:
          PROD_NEXTAUTH_URL: ${{ secrets.PROD_NEXTAUTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
